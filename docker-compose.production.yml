name: trainpptagent-production

services:
  personaldb:
    image: trainpptagent-personaldb:${TRAINPPT_IMAGE_TAG:-local}
    build:
      context: ./backend/personaldb
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PERSONALDB_PORT: "9100"
    expose:
      - "9100"
    restart: unless-stopped
    labels:
      org.opencontainers.image.revision: ${RELEASE_COMMIT:?RELEASE_COMMIT must be a full Git SHA}
      com.trainpptagent.component: personaldb
    networks: [trainppt]

  outline_api:
    image: trainpptagent-outline-api:${TRAINPPT_IMAGE_TAG:-local}
    build:
      context: ./backend/simpleOutline
      dockerfile: Dockerfile
    env_file: .env
    environment:
      OUTLINE_API: http://outline_api:10001
    command: ["python", "main_api.py", "--host", "0.0.0.0", "--port", "10001", "--agent_url", "http://outline_api:10001/"]
    expose:
      - "10001"
    restart: unless-stopped
    labels:
      org.opencontainers.image.revision: ${RELEASE_COMMIT:?RELEASE_COMMIT must be a full Git SHA}
      com.trainpptagent.component: outline_api
    networks: [trainppt]

  content_api:
    image: trainpptagent-content-api:${TRAINPPT_IMAGE_TAG:-local}
    build:
      context: ./backend/slide_agent
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CONTENT_API: http://content_api:10011
      PERSONAL_DB: http://personaldb:9100
    command: ["python", "main_api.py", "--host", "0.0.0.0", "--port", "10011", "--agent_url", "http://content_api:10011/"]
    expose:
      - "10011"
    restart: unless-stopped
    labels:
      org.opencontainers.image.revision: ${RELEASE_COMMIT:?RELEASE_COMMIT must be a full Git SHA}
      com.trainpptagent.component: content_api
    networks: [trainppt]

  main_api:
    image: trainpptagent-main-api:${TRAINPPT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/main_api/Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      APP_BASE_URL: https://${SERVER_NAME:-ppt.axicomin.cn}
      SESSION_COOKIE_SECURE: "true"
      # 生产计费默认关闭，仅允许发布脚本通过显式 BILLING_MODE 覆盖。
      BILLING_ENABLED: "${BILLING_ENABLED:-false}"
      RELEASE_COMMIT: ${RELEASE_COMMIT:?RELEASE_COMMIT must be a full Git SHA}
      RELEASE_CHANNEL: production
      OUTLINE_API: http://outline_api:10001
      CONTENT_API: http://content_api:10011
      PERSONAL_DB: http://personaldb:9100
    expose:
      - "6800"
    depends_on:
      - personaldb
      - outline_api
      - content_api
    restart: unless-stopped
    labels:
      org.opencontainers.image.revision: ${RELEASE_COMMIT:?RELEASE_COMMIT must be a full Git SHA}
      com.trainpptagent.component: main_api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6800/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [trainppt]

  task_worker:
    image: trainpptagent-main-api:${TRAINPPT_IMAGE_TAG:-local}
    profiles: ["worker"]
    env_file: .env
    environment:
      APP_ENV: production
      APP_BASE_URL: https://${SERVER_NAME:-ppt.axicomin.cn}
      SESSION_COOKIE_SECURE: "true"
      # API 与 Worker 必须使用完全相同的计费开关。
      BILLING_ENABLED: "${BILLING_ENABLED:-false}"
      TASK_WORKER_ENABLED: "true"
      RELEASE_COMMIT: ${RELEASE_COMMIT:?RELEASE_COMMIT must be a full Git SHA}
      RELEASE_CHANNEL: production
      TASK_HANDLER_FACTORY: backend.main_api.workers.presentation_handler:create_handler
      OUTLINE_API: http://outline_api:10001
      CONTENT_API: http://content_api:10011
      PERSONAL_DB: http://personaldb:9100
    command: ["python", "-m", "backend.main_api.workers.main"]
    depends_on:
      - outline_api
      - content_api
      - personaldb
    restart: unless-stopped
    labels:
      org.opencontainers.image.revision: ${RELEASE_COMMIT:?RELEASE_COMMIT must be a full Git SHA}
      com.trainpptagent.component: task_worker
    networks: [trainppt]

  frontend:
    image: trainpptagent-frontend:${TRAINPPT_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SSO_ENABLED: "true"
        VITE_MOLING_PORTAL_URL: ${VITE_MOLING_PORTAL_URL:-https://moling.axicomin.cn}
    environment:
      SERVER_NAME: ${SERVER_NAME:-ppt.axicomin.cn}
      MAIN_API_UPSTREAM: main_api:6800
      TRUSTED_PROXY_IP: ${TRAINPPT_GATEWAY_IP:-172.29.23.1}
      NGINX_ENVSUBST_FILTER: "^(SERVER_NAME|MAIN_API_UPSTREAM|TRUSTED_PROXY_IP)$"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5778}:80"
    depends_on:
      main_api:
        condition: service_healthy
    restart: unless-stopped
    labels:
      org.opencontainers.image.revision: ${RELEASE_COMMIT:?RELEASE_COMMIT must be a full Git SHA}
      com.trainpptagent.component: frontend
    networks: [trainppt]

networks:
  trainppt:
    driver: bridge
    ipam:
      config:
        - subnet: ${TRAINPPT_SUBNET:-172.29.23.0/24}
          gateway: ${TRAINPPT_GATEWAY_IP:-172.29.23.1}

completion_criteria:
  - id: "criterion-reference-rights"
    description: "参考稿只抽象提取结构与视觉规律，未知权利媒体、字体、品牌、人物和音频均未原样进入生产模板。"
  - id: "criterion-page-inventory"
    description: "20 个 MVP 与 39 个生产版式的稳定 ID、页面类型、库存、画布和 MVP 标记与批准规格一致。"
  - id: "criterion-template-protocol"
    description: "页面类型、文字槽、内容图与装饰图遵守 TrainPPTAgent 语义协议。"
  - id: "criterion-selection-determinism"
    description: "每个声明为合法的输入组合恰好命中一个稳定 layout ID；显式专项版式非法输入和矩阵外组合返回明确 TemplateRenderError。"
  - id: "criterion-capacity-selection"
    description: "目录 3 至 6 项、正文 1 至 6 项按精确容量确定性选版，普通正文 7 项固定分页为 6+1。"
  - id: "criterion-specialty-layouts"
    description: "focus、hero、metrics、compare、gallery、timeline、process 和 positioning 均可由明确条件到达。"
  - id: "criterion-overflow"
    description: "普通正文从 7 项起、目录从 7 项起以及长正文均按声明规则无损分页，不通过缩小到不可读字号解决。"
  - id: "criterion-title-fit"
    description: "封面标题与产品图安全区无重叠；长标题按单行、两行、改选封面或明确报错处理，不截断或缩小到最小字号以下。"
  - id: "criterion-image-semantics"
    description: "图片数 × item 数矩阵中的每个合法组合唯一选版或分页，矩阵外组合明确报错；裁切比例正确且固定装饰不被替换。"
  - id: "criterion-assets"
    description: "外置素材的格式、尺寸、模式、Alpha、体积、唯一文件名和发布集合符合 manifest。"
  - id: "criterion-registration"
    description: "模板列表唯一注册，JSON、封面和所有外置资源可通过预期路由读取。"
  - id: "criterion-real-generation"
    description: "持久 Worker 使用真实语义输入生成成功，并覆盖所有声明页面类型。"
  - id: "criterion-editing"
    description: "文字编辑保存后可重新加载，内容图可替换且固定装饰保持不变。"
  - id: "criterion-responsive"
    description: "桌面、笔记本、平板和手机视口无横向溢出，核心编辑和导出操作可触达。"
  - id: "criterion-button-feedback"
    description: "模板选择、生成、保存、换图、导出和失败重试按钮均有加载、成功、失败或明确假性交互反馈。"
  - id: "criterion-export-roundtrip"
    description: "PPTX 导出、解析、重导入后页数与核心结构合理且仍可继续编辑。"

qa:
  content_cases:
    - id: "case-reference-rights-audit"
      purpose: "核对参考媒体、品牌、字体、人物、音频的权利动作与禁带清单。"
    - id: "case-page-inventory"
      purpose: "验证 20 个 MVP、39 个生产版式的稳定 ID、页面类型、数量、画布与全局唯一 ID。"
    - id: "case-template-protocol"
      purpose: "验证页面、文字、图片语义槽和固定装饰协议。"
    - id: "case-selection-partition"
      purpose: "枚举普通、metrics、显式专项和图片输入，断言每个合法输入恰好命中一个 layout ID，非法输入明确报错。"
    - id: "case-contents-capacity"
      purpose: "验证 3、4、5、6 项目录精确选版及超量分页。"
    - id: "case-text-capacity"
      purpose: "验证 1 至 6 项普通正文精确选版、7 项固定 6+1，且不泄漏到专项版式。"
    - id: "case-specialty-layouts"
      purpose: "验证全部专项版式的显式或严格语义到达条件。"
    - id: "case-overflow-pagination"
      purpose: "验证 7、8、11 项和长正文无损分页、顺序保持和单张关联图片只在首段保留。"
    - id: "case-title-fit-boundaries"
      purpose: "验证封面 24/25、36/37、48/49、72/73，内容标题 20/21、36/37、44/45、80/81，以及中英数字混排等式边界；检查单行、两行、改选、超限报错和标题/产品图零重叠。"
    - id: "case-image-crop-and-errors"
      purpose: "验证横图、竖图、方图裁切、缺失尺寸和图片数越界错误。"
    - id: "case-image-item-matrix"
      purpose: "覆盖 0、1、2、3..6、7+ 张图片与 item 数的全部声明组合，验证唯一版式、分页或明确错误。"
    - id: "case-asset-manifest"
      purpose: "验证外置素材与封面的尺寸、模式、Alpha、体积和发布集合。"
    - id: "case-registration-routes"
      purpose: "验证模板唯一注册及 JSON、封面、素材路由。"
    - id: "case-worker-generation"
      purpose: "使用持久 Worker 与真实语义输入完成生成。"
    - id: "case-edit-persistence"
      purpose: "编辑文字、保存、重新加载并核对结果。"
    - id: "case-image-replacement"
      purpose: "替换内容图并确认固定装饰与分组不变。"
    - id: "case-button-feedback"
      purpose: "验证加载、成功、失败与可重试反馈，避免按钮无响应。"
  image_counts:
    - id: "case-image-counts"
      values: [0, 1, 2, 3, 4, 5, 6, 7]
  viewports:
    - id: "viewport-desktop"
      width: 1440
      height: 900
    - id: "viewport-laptop"
      width: 1280
      height: 720
    - id: "viewport-tablet"
      width: 768
      height: 1024
    - id: "viewport-mobile"
      width: 390
      height: 844
  export_roundtrip_required: true
  affected_test_commands:
    - ".\\.venv\\Scripts\\python.exe -m pytest backend/main_api/tests/test_template_15.py"
    - ".\\.venv\\Scripts\\python.exe -m pytest backend/main_api/tests/test_template_assets.py backend/main_api/tests/test_template_renderer.py"
  coverage_map:
    criterion-reference-rights: ["case-reference-rights-audit"]
    criterion-page-inventory: ["case-page-inventory"]
    criterion-template-protocol: ["case-template-protocol"]
    criterion-selection-determinism: ["case-selection-partition", "case-image-item-matrix"]
    criterion-capacity-selection: ["case-contents-capacity", "case-text-capacity"]
    criterion-specialty-layouts: ["case-specialty-layouts"]
    criterion-overflow: ["case-overflow-pagination"]
    criterion-title-fit: ["case-title-fit-boundaries"]
    criterion-image-semantics: ["case-image-counts", "case-image-item-matrix", "case-image-crop-and-errors", "case-image-replacement"]
    criterion-assets: ["case-asset-manifest"]
    criterion-registration: ["case-registration-routes"]
    criterion-real-generation: ["case-worker-generation"]
    criterion-editing: ["case-edit-persistence", "case-image-replacement"]
    criterion-responsive: ["viewport-desktop", "viewport-laptop", "viewport-tablet", "viewport-mobile"]
    criterion-button-feedback: ["case-button-feedback", "viewport-desktop", "viewport-laptop", "viewport-tablet", "viewport-mobile"]
    criterion-export-roundtrip: ["export-roundtrip"]

planning_run_permissions:
  allow_image_generation: false
  allow_code_changes: false
  allow_git_commit: false
  allow_git_push: false
  allow_merge_main: false
  allow_service_restart: false
  allow_production_deploy: false

required_build_authorizations:
  image_generation: true
  code_changes: true
  real_task_execution: true
  final_manual_close: true

open_decisions: []

known_limits:
  - "候选 ID template_15 只在 2026-08-30 的联合扫描中可用，实施开始前必须重新扫描。"
  - "参考稿是约 3:1 超宽画布；生产模板按项目协议改为 16:9，不承诺像素级复刻。"
  - "参考稿权利证明未提供，42 个图片资源、17 个 WDP 资源、1 个 WAV 音频、品牌文本和非项目字体均不原样复用。"
  - "当前运行时无法完整渲染该 PPTX；视觉判断来自结构化提取、封面缩略图、全部嵌入媒体蒙太奇和 OOXML 布局检查，构建阶段仍需逐页真实渲染复核。"
  - "参考稿中的动画和音频不进入生产模板；模板只规划静态、可编辑的演示结构。"

visual:
  theme: "深海军蓝基底上的蓝紫光谱地平线；用大字号结论、单一产品主角和少量霓虹强调建立未来感，但避免复杂仪表盘式卡片堆叠。"
  palette:
    - id: "night"
      value: "#050A24"
      purpose: "主背景与沉浸式发布舞台"
    - id: "deep-blue"
      value: "#0B1F4D"

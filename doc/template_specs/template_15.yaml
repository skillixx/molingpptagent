    - id: "magenta"
      value: "#F34AA9"
      purpose: "少量强对比节点，单页占比不超过 8%"
    - id: "paper-white"
      value: "#F5F8FF"
      purpose: "标题与高优先级正文"
    - id: "mist-blue"
      value: "#A9BDD8"
      purpose: "次要说明与页脚"
  fonts:
    heading: "微软雅黑"
    body: "微软雅黑"
    latin_and_numbers: "Arial"
  safe_zones:
    - id: "global-content"
      description: "所有可编辑信息保持在 x=64..936、y=42..516；页码与装饰不得侵入正文列。"
    - id: "cover-title"
      description: "带产品图封面标题位于 x=70..520、y=112..370；右侧 x=590..940 只供可替换产品主图，二者至少相隔 70 像素。"
    - id: "slide-title"
      description: "内容页标题保持在 x=64..936、y=44..132；单行标题使用 y=44..104，两行标题使用独立的 y=38..132 区域，正文从 y=150 后开始。"
    - id: "product-hero"
      description: "主产品图位于 x=590..940、y=110..500，至少保留 24 像素内边距且不得进入标题区。"
    - id: "spectrum-footer"
      description: "固定光谱装饰限制在 y=430..562.5，主体文字不得进入 y=500 以下。"
  title_fit_policy:
    normalization: "先做 Unicode NFC 规范化并去除首尾空白；ASCII 字母、数字、半角标点与内部半角空格计入 ascii_count，CJK、全角字符及其他非 ASCII 码点计入 wide_count。"
    mixed_measure: "每个场景使用整数不等式 wide_count*latin_limit + ascii_count*cjk_limit <= cjk_limit*latin_limit；不得按字节数、字符串总长度或渲染器猜测计量。"
    cover_hero: "cjk_limit=24、latin_limit=48，最多两行且保持 50pt；不等式失败时自动改选 cover-minimal，不截断、不缩小。"
    cover_minimal: "cjk_limit=36、latin_limit=72，最多两行且保持 50pt；不等式失败时返回明确 TemplateRenderError。"
    slide_title: "单行 cjk_limit=20、latin_limit=44；单行失败后用两行 cjk_limit=36、latin_limit=80 并保持至少 36pt；两行仍失败时返回明确 TemplateRenderError。"
    no_loss: "所有标题禁止截断、隐藏、覆盖产品图或缩小到最小字号以下。"
  forbidden_content:
    - "参考稿中的 Electronic、Note x、产品型号、商标和第三方 Logo"
    - "参考稿中的手机、手表、城市照片、UI 截图和图标原图"
    - "水印、伪文字、假截图、仿冒品牌标识和不可验证数据"
    - "未授权真实人物肖像或可识别公司、学校和机构场景"
    - "把 3:1 参考画布直接拉伸到 16:9"
  logo_policy: "只提供中性品牌占位区；构建时不得携带参考稿品牌，业务 Logo 由用户内容或已授权项目资产注入。"
  people_policy: "固定装饰不使用真实人物；内容图如需人物，只接受用户提供、明确授权或为项目生成的非特定人物素材。"


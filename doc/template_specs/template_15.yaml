  selection_precedence:
    - "1. 先验证显式 layoutKind 与输入形状；显式专项版式不满足 specialty_invalid_inputs 时立即返回 TemplateRenderError，不回退。"
    - "2. 再验证图片尺寸、images<=items 及 image_item_matrix；不在矩阵中的组合立即报错。"
    - "3. 对合法显式 layoutKind 按 catalog 精确选版。"
    - "4. 无显式 layoutKind 时先按图片数量选择 hero、dense、dual-image 或 gallery。"
    - "5. 无图片时，3 至 5 个全部 kind=metric 的 items 优先选择 metrics。"
    - "6. 其余无图片输入才按 content-text-1..6 选择；每个合法输入必须恰好命中一个 layout ID。"
  image_item_matrix:
    - image_count: 0
      item_count: "1..6"
      outcome: "按显式专项、inferred metrics 或 content-text 精确选版；0 项报错，7 项以上按 ordinary_text 分页。"
    - image_count: 1
      item_count: "1..3"
      outcome: "content-hero-left/right；显式 hero 只在此范围合法。"
    - image_count: 1
      item_count: "4..6"
      outcome: "content-image-1-dense；layoutKind 必须为空。"
    - image_count: 1
      item_count: "7+"
      outcome: "首 6 项使用 content-image-1-dense，后续页无图并重新按 selection_precedence 选择 text 或 metrics；单图只跟随首个关联 item。"
    - image_count: 2
      item_count: "2..6"
      outcome: "content-dual-image-2；两图分别关联前两个 items。"
    - image_count: 2
      item_count: "7+"
      outcome: "首 6 项使用 content-dual-image-2，后续页无图并重新按 selection_precedence 选择 text 或 metrics。"
    - image_count: "3..6"
      item_count: "必须等于 image_count"
      outcome: "按 content-gallery-3..6 精确选版；多余无图 item 或图片多于 item 均报错。"
    - image_count: "7+"
      item_count: "必须等于 image_count"
      outcome: "按原顺序每页最多 6 个 image-item 对分页；每页依 1/2/3..6 图选择 hero、dual-image 或 gallery。"
  specialty_invalid_inputs:
    focus: "显式 focus 仅允许 0 图且 items=1；其他组合返回 TemplateRenderError。"
    hero: "显式 hero 仅允许 1 图且 items=1..3；缺图、多图或 4 项以上返回 TemplateRenderError。"
    metrics: "显式 metrics 仅允许 0 图、items=3..5 且每项 kind=metric；其他组合返回 TemplateRenderError。"
    compare: "显式 compare 仅允许 0 图且 items 为 2 或 4；其他组合返回 TemplateRenderError。"
    gallery: "显式 gallery 允许 2 图+2..6 项，或 3..6 图且 items 与图片等量；其他组合返回 TemplateRenderError。"
    timeline: "显式 timeline 仅允许 0 图且 items=3..5；其他组合返回 TemplateRenderError。"
    process: "显式 process 仅允许 0 图且 items=3..5；其他组合返回 TemplateRenderError。"
    positioning: "显式 positioning 仅允许 0 图且 items 为 3 或 4；其他组合返回 TemplateRenderError。"
  transition_variant_policy: "transition 的 sectionIndex 从 1 开始；variant 仅允许 horizon、spectrum、particle、stage，未知值或小于 1 的 sectionIndex 返回 TemplateRenderError。"
  overflow_rules:
    contents: "目录 3 至 6 项精确选版；超过 6 项时按最少页数切分为每页 3 至 6 项且页间数量差不超过 1（例如 7=4+3、11=6+5）；少于 3 项明确报错。"
    ordinary_text: "普通无图正文 1 至 6 项精确选版；7 项固定分页为 6+1；超过 7 项按原顺序每页最多 6 项分页，最后一页允许 1 至 6 项。"
    content_images: "图片按顺序与前 N 个 items 关联并遵守 image_item_matrix；1/2 图可搭配更多文字并只出现在包含对应 item 的首个分页，3 至 6 图必须与 items 等量，7 图固定 6+1，7 图以上必须与 items 等量并每页最多 6 组；矩阵外组合、缺失尺寸或图片多于 items 明确报错。"
    long_body: "长正文按字符和段落边界无损分页；与正文关联的单张内容图只保留在首个续页，固定装饰在所有续页保持。"
    specialty: "compare、metrics、timeline、process、positioning 的显式容量必须命中 catalog；越界时返回 TemplateRenderError，不静默改为另一专项版式。"
  specialty_layouts:
    - id: "focus"
      purpose: "单一发布主张或产品结论"
      selection_rule: "仅允许无内容图且 items 恰为 1；可由默认规则或显式 layoutKind=focus 到达，显式 focus 的其他输入报错。"
    - id: "hero"
      purpose: "产品主图与一组核心卖点"
      selection_rule: "仅允许 1 张内容图且 items 为 1 至 3；可由默认规则或显式 layoutKind=hero 到达，显式 hero 的其他输入报错。"
    - id: "metrics"
      purpose: "3 至 5 个核心性能指标"
      selection_rule: "无内容图、全部 items.kind 均为 metric 且数量为 3 至 5；显式 metrics 的其他输入报错。"
    - id: "compare"
      purpose: "双产品或双方案对比"
      selection_rule: "显式 layoutKind=compare、无内容图且 items 数量为 2 或 4；其他输入报错，不从普通双列内容自动推断。"
    - id: "gallery"
      purpose: "2 至 6 张产品细节或场景图"
      selection_rule: "默认 3 至 6 图且与 items 等量时到达；显式 gallery 另允许 2 图+2..6 项，其他输入报错。"
    - id: "timeline"
      purpose: "上市节奏、路线图或版本演进"
      selection_rule: "显式 layoutKind=timeline、无内容图且 items 数量为 3 至 5；其他输入报错。"
    - id: "process"
      purpose: "技术链路、体验步骤或交付流程"
      selection_rule: "显式 layoutKind=process、无内容图且 items 数量为 3 至 5；其他输入报错。"
    - id: "positioning"
      purpose: "目标人群、使用场景与市场定位"
      selection_rule: "显式 layoutKind=positioning、无内容图且 items 数量为 3 或 4；其他输入报错。"

semantics:
  page_types: ["cover", "contents", "transition", "content", "end"]
  text_types: ["title", "subtitle", "item", "itemNumber", "metric", "label", "description", "callout"]
  content_image_type: "content"
  decoration_image_type: "decoration"
  minimum_font_sizes:
    cover_title: 50
    slide_title: 36
    section_title: 44
    subheading: 24
    body: 16
    caption: 14
  overflow_policy: "paginate-without-loss"
  grouping_policy: "content-images-independent"


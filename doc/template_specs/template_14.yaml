template:
  id: 'template_14'
  id_status: 'candidate'
  name: '深蓝青棱商务信息图'
  category: 'business-infographic'
  requirements_summary: '面向企业内部汇报、项目复盘、策略说明和方案提案，提供深蓝与青蓝几何切面的克制商务视觉，并覆盖目录、章节、1 至 6 项正文、指标、流程、对比、时间线和 1 至 6 图内容版式。'
  reference_files:
    - path: 'C:\Users\sk20\Desktop\ppt\扁平风格(38).pptx'
      sha256: '7f8ab71aac06f3ae497bc4ded6b1ab83291eede2a2f48f10154c438b6be9c958'
      rights_status: 'unknown'
      planned_action: 'redraw-and-regenerate'
  canvas:
    width: 1000
    height: 562.5
  cover:
    width: 960
    height: 540

reference_audit:
  structural_summary:
    slide_count: 27
    aspect_ratio: '16:9'
    notes_slide_count: 27
    image_count: 6
    chart_part_count: 0
    smartart_part_count: 0
    embedded_object_count: 0
    note_content: '备注页仅含页码，没有可执行指令。'
  reusable_patterns:
    - '深蓝整页底色与青蓝三角切面的对角张力。'
    - '超大章节数字配短标题的章节过渡结构。'
    - '目录、流程、对比、百分比、中心辐射、图文分栏和多图画廊等信息图结构。'
    - '正文页统一左上标题区，并以大面积留白组织主体内容。'
  media_actions:
    - source: 'ppt/media/image1.jpg'
      rights_status: 'unknown'
      action: 'replace'
      reason: '城市建筑照片来源与授权未知，只保留横向城市图的构图需求。'
    - source: 'ppt/media/image2.jpg'
      rights_status: 'unknown'
      action: 'replace'
      reason: '城市街景含大量商业招牌，生产模板改用用户内容图或已授权素材。'
    - source: 'ppt/media/image3.jpg'
      rights_status: 'unknown'
      action: 'exclude'
      reason: '图片带明显第三方网站水印，不进入生产素材。'
    - source: 'ppt/media/image4.jpg'
      rights_status: 'unknown'
      action: 'exclude'
      reason: '时代广场画面含大量广告、商标和人物形象，不作为生产替代素材的内容来源。'
    - source: 'ppt/media/image5.jpg'
      rights_status: 'unknown'
      action: 'replace'
      reason: '交通街景来源未知，只抽象为城市运营场景的内容图需求。'
    - source: 'ppt/media/image6.jpg'
      rights_status: 'unknown'
      action: 'replace'
      reason: '欧洲城市广场照片来源未知，生产模板仅保留可替换图片槽。'
  font_actions:
    - source_fonts: ['Agency FB', 'Nexa Bold', 'Impact']
      action: 'replace'
      production_fonts: ['Arial Bold', 'Arial']
      reason: '避免依赖参考稿中的非通用西文字体。'
    - source_fonts: ['时尚中黑简体', '方正兰亭刊黑_GBK', '汉仪大宋简']
      action: 'replace'
      production_fonts: ['微软雅黑 Bold', '微软雅黑']
      reason: '不从 PPTX 提取字体文件，使用当前系统与项目可用字体。'
  forbidden_carryovers:
    - '参考稿中的 2019、XXX、FEI ER SHE JI、占位标题和英文示例正文。'
    - '参考稿的城市照片、水印、广告牌、商标和真实人物画面。'
    - '任何未验证授权的字体文件、Logo、品牌色锁定或第三方 UI 截图。'
  visual_verification:
    structure_method: '规划脚本、PPTX 包 XML 和 artifact-tool 导入对象逐页检查。'
    visual_method: '内嵌封面缩略图、6 张媒体原图、主题色、元素位置和字号的人工综合判断。'
    rendering_limit: '当前环境的 artifact-tool 可导入 27 页但导出 PNG 时退出，本机没有 PowerPoint 或 LibreOffice；因此不主张逐像素复刻，实施按原创重绘方向执行。'

visual:
  theme: '深蓝理性底色、青蓝半透明几何切面和高留白信息图；封面、章节、结束页采用深色沉浸面，正文页采用暖白底并保留青蓝导视。'
  palette:
    - id: 'navy'
      value: '#354A62'
      purpose: '封面、章节和结束页主背景'
    - id: 'deep-navy'
      value: '#243447'
      purpose: '深色层次、正文主文字和高对比区'
    - id: 'cyan'
      value: '#45BEE3'
      purpose: '主强调、章节编号和关键图形'
    - id: 'blue'
      value: '#28A7CF'
      purpose: '辅助切面、进度和图表层次'
    - id: 'signal-red'
      value: '#FD5B5B'
      purpose: '仅用于风险、负向变化或关键警示'
    - id: 'warm-white'
      value: '#F6F8FA'
      purpose: '正文页背景和深色页面上的高对比文字'
    - id: 'slate'
      value: '#6C7B8B'
      purpose: '辅助正文、说明文字和次级刻度'
  fonts:
    chinese_heading: '微软雅黑 Bold'
    chinese_body: '微软雅黑'
    latin_heading: 'Arial Bold'
    latin_body: 'Arial'
  safe_zones:
    - id: 'cover-title'
      description: '画布坐标 x=88..760、y=184..398 保持低细节，标题最多两行，右上和左下装饰不得侵入。'
    - id: 'content-header'
      description: '正文页 x=44..956、y=28..104 只放标题、短副标题和导视线；主体元素从 y=126 开始。'
    - id: 'content-body'
      description: '正文主体限制在 x=52..948、y=126..516，四周至少保留 32 画布单位。'
    - id: 'content-image'
      description: '内容图不得进入标题区或页脚区，裁切后主体至少离边缘 6%，并与装饰图片独立。'
    - id: 'corner-decoration'
      description: '固定装饰优先占用 x=0..170,y=430..562.5 与 x=790..1000,y=0..145，不遮挡动态内容。'
    - id: 'footer'
      description: '页码或来源提示只允许在 y=528..552，字号不低于 12。'
  forbidden_content:
    - '未授权 Logo、商标、真实人物肖像和第三方 UI 截图'
    - '水印、伪文字、假数据、假截图和无法追溯的统计结论'
    - '参考稿中的占位文案、年份、品牌标识和城市照片原件'
    - '低对比文字、不可读小字号和将按钮绘制成可点击但无反馈的状态'
  logo_policy: 'no-unlicensed-logo; 默认仅提供中性 Logo 占位安全区，只有用户或项目已授权资产才能填入。'
  people_policy: 'no-unlicensed-likeness; 人物内容仅接受用户提供、项目自有或许可清楚的素材。'


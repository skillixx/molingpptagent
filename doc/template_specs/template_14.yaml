        page_type: 'content'
        capacity: '1/2/3/4/5/6'
        count: 9
        selection_rule: '无图普通内容先按 item 槽位容量精确匹配；2、3、4 项的同分变体按内容页序稳定轮换。'
      - id: 'content-image-capacity-set'
        page_type: 'content'
        capacity: '1/2/3/4/5/6'
        count: 6
        selection_rule: '图片数必须等于内容项数并精确匹配内容图片槽数量。'
      - id: 'content-metrics-set'
        page_type: 'content'
        capacity: '3/4/5'
        count: 3
        selection_rule: 'data.layoutKind=metrics，或任一 item.kind 为 metric、number、stat 时选择。'
      - id: 'content-process-set'
        page_type: 'content'
        capacity: '4/5'
        count: 2
        selection_rule: 'data.layoutKind=process 且无内容图片时选择。'
      - id: 'content-compare-set'
        page_type: 'content'
        capacity: '2/4'
        count: 2
        selection_rule: 'data.layoutKind=compare 且无内容图片时选择。'
      - id: 'content-hub-spoke-5'
        page_type: 'content'
        capacity: 5
        count: 1
        selection_rule: 'data.layoutKind=hub-spoke 且恰好 5 项时选择。'
      - id: 'content-timeline-4'
        page_type: 'content'
        capacity: 4
        count: 1
        selection_rule: 'data.layoutKind=timeline 且恰好 4 项时选择。'
      - id: 'end-pair'
        page_type: 'end'
        capacity: 1
        selection_rule: '两种变体启用 variantMode=deterministic，由稳定种子和页序选择。'
  specialty_layouts:
    - id: 'metrics-radial'
      purpose: '展示 3 至 5 个关键指标、占比或阶段达成率。'
      selection_rule: 'data.layoutKind=metrics，或任一 item.kind 属于 metric/number/stat；按 3、4、5 项精确容量选版。'
    - id: 'process-chain'
      purpose: '展示 4 或 5 个有顺序的步骤、方法或实施阶段。'
      selection_rule: 'data.layoutKind=process 且内容项为 4 或 5、图片数为 0。'
    - id: 'compare-balanced'
      purpose: '展示 2 项或 4 项同口径方案、现状或优劣对比。'
      selection_rule: 'data.layoutKind=compare 且内容项为 2 或 4、图片数为 0。'
    - id: 'hub-spoke'
      purpose: '展示一个中心主题和四个依赖分支。'
      selection_rule: 'data.layoutKind=hub-spoke 且内容项恰好为 5、图片数为 0。'
    - id: 'timeline-zigzag'
      purpose: '展示 4 个日期、里程碑或阶段结果。'
      selection_rule: 'data.layoutKind=timeline 且内容项恰好为 4、图片数为 0。'
    - id: 'image-gallery'
      purpose: '展示 3 至 6 张等权内容图及短说明。'
      selection_rule: 'data.layoutKind=gallery，图片数等于内容项数，并按 3、4、5、6 图精确选版。'
    - id: 'headline-focus'
      purpose: '突出单一结论、关键动作或一句话观点。'
      selection_rule: 'data.layoutKind=focus 且仅 1 个内容项、图片数为 0。'

semantics:
  page_types: ['cover', 'contents', 'transition', 'content', 'end']
  text_types: ['title', 'subtitle', 'section-number', 'item', 'itemNumber', 'metric', 'content', 'caption', 'footer']
  content_image_type: 'content'
  decoration_image_type: 'decoration'
  minimum_font_sizes:
    deck_title: 44
    slide_title: 28
    section_number: 60
    item_title: 18
    metric: 24
    body: 16
    caption: 12
    footer: 12
  overflow_policy: 'paginate-without-loss'
  grouping_policy: 'content-images-independent'
  capacity_rules:
    contents: '2、3、4、5、6、10 项精确选版；其他数量保持顺序无损分页。'
    content: '1 至 6 项精确选版；7 项及以上按每页最多 6 项无损分页，续页标题增加“（续）”。'
    long_body: '按当前渲染器的可读容量拆分正文，连接拆分片段后必须与原文逐字一致。'
    content_images: '内容图片与内容项一一对应；带图长正文只在首段保留图片，续段进入纯文字页。'
  interaction_policy: '模板选择、生成、保存、换图、导出和重试按钮必须呈现加载、成功、失败或明确的假性交互反馈，失败后恢复可点击状态。'

assets:
  generator_preference: 'gpt-image-2'
  max_total_generation_attempts: 15

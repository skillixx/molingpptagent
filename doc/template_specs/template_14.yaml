completion_criteria:
  - id: 'criterion-reference-rights'
    description: '参考文件哈希、媒体、字体和禁止带入项均有可追溯权利动作，未知素材不原样复用。'
  - id: 'criterion-visual-system'
    description: '深蓝青蓝几何视觉、字体层级、安全区和色彩对比在所有页面类型中一致。'
  - id: 'criterion-page-inventory'
    description: 'MVP 与生产页面库存、容量和稳定 ID 与批准规格一致且全局唯一。'
  - id: 'criterion-deterministic-selection'
    description: '目录、普通内容、指标、流程、对比、中心辐射、时间线和图文版式均可由明确输入确定选中。'
  - id: 'criterion-typography'
    description: '标题、正文、指标、说明和页脚不低于规定字号，缺失字体时使用批准回退字体且不溢出。'
  - id: 'criterion-overflow'
    description: '7 项以上、长正文和带图长正文按原顺序无损分页，不通过不可读小字号压缩。'
  - id: 'criterion-image-protocol'
    description: '0 至 6 图精确或无图选版，7 图无损分页；裁切、缺失尺寸和数量不匹配行为明确。'
  - id: 'criterion-decoration-isolation'
    description: '内容图片可独立替换，固定装饰为 decoration 且不会被替换或删除。'
  - id: 'criterion-assets'
    description: '五项发布素材的格式、尺寸、色彩模式、Alpha、体积、来源和提示词记录满足 manifest。'
  - id: 'criterion-registration'
    description: '模板列表仅注册一次，JSON、封面和外置资源可通过当前 API 路由读取。'
  - id: 'criterion-real-generation'
    description: '持久 Worker 使用 template_14 完成真实生成，声明的页面类型和专项版式可在真实作品中出现。'
  - id: 'criterion-responsive'
    description: '桌面、笔记本、平板和手机视口无横向溢出，关键操作可见可触达。'
  - id: 'criterion-interactions'
    description: '选择、生成、保存、换图、导出和失败重试均有加载、成功、失败或明确假性交互反馈。'
  - id: 'criterion-editable'
    description: '编辑文字、保存重载和替换内容图后结果持久化，固定装饰与分组关系保持正确。'
  - id: 'criterion-export-roundtrip'
    description: 'PPTX 可导出、解析、重导入并继续编辑，页数与核心结构合理。'

qa:
  content_cases:
    - id: 'case-spec-inventory'
      purpose: '校验模板 ID、画布、页面库存、MVP 标记、全局元素 ID 和元数据。'
    - id: 'case-registration-and-resources'
      purpose: '校验模板列表唯一注册以及 JSON、封面和外置素材响应。'
    - id: 'case-contents-capacity'
      purpose: '验证 2、3、4、5、6、10 项目录的精确容量与超量分页。'
    - id: 'case-text-capacity'
      purpose: '验证 1 至 6 项普通正文按容量精确选版。'
    - id: 'case-specialty-layout-kind'
      purpose: '验证 metrics、process、compare、hub-spoke、timeline、gallery 和 focus 可由 layoutKind 到达。'
    - id: 'case-overflow-eight-items'
      purpose: '验证 8 项正文按原顺序拆为两页且字符不丢失。'
    - id: 'case-long-body-split'
      purpose: '验证中英文长正文按可读容量拆分，拼接结果与原文逐字相同。'
    - id: 'case-long-body-with-images'
      purpose: '验证带图长正文仅首段保留内容图，续段转入纯文字页。'
    - id: 'case-image-crop-ratios'
      purpose: '验证横图、竖图、方图均保持比例并中心裁切到目标框。'
    - id: 'case-missing-image-dimensions'
      purpose: '验证缺少宽高的内容图片返回明确错误而不是拉伸。'
    - id: 'case-image-count-mismatch'
      purpose: '验证图片数大于内容项数或与严格槽位不匹配时返回安全错误。'
    - id: 'case-decoration-isolation'
      purpose: '验证 content 与 decoration 图片角色、分组和锁定规则互不污染。'
    - id: 'case-assets-contract'
      purpose: '校验素材发布集合、格式、尺寸、模式、Alpha、体积和引用路径。'
    - id: 'case-rights-review'
      purpose: '复核素材来源、提示词、参考媒体替代动作和禁止带入项。'
    - id: 'case-visual-review'
      purpose: '逐页检查层级、色彩、留白、安全区、对比度、换行、遮挡和模糊裁切。'
    - id: 'case-font-fallback'
      purpose: '在缺失参考字体时验证微软雅黑和 Arial 回退、字号与排版稳定。'
    - id: 'case-real-worker-generation'
      purpose: '使用真实持久 Worker 生成代表性商务主题作品并覆盖所有声明页面类型。'
    - id: 'case-picker-unique'
      purpose: '验证模板选择列表只显示一个 template_14，名称和封面正确。'
    - id: 'case-edit-save-reload'
      purpose: '编辑标题和正文，保存并重新加载后内容保持。'
    - id: 'case-content-image-replace'
      purpose: '替换内容图后裁切正确，固定装饰、背景和锁定元素不变。'
    - id: 'case-async-error-feedback'
      purpose: '模拟生成、保存、导出失败，检查可见失败反馈、按钮恢复和可重试。'
  image_counts:
    - id: 'case-image-counts'
      values: [0, 1, 2, 3, 4, 5, 6, 7]
  viewports:
    - id: 'viewport-desktop'
      width: 1920
      height: 1080
    - id: 'viewport-laptop'
      width: 1366
      height: 768
    - id: 'viewport-tablet'
      width: 768
      height: 1024
    - id: 'viewport-mobile'
      width: 390
      height: 844
  export_roundtrip_required: true
  affected_test_commands:
    - '.\.venv\Scripts\python.exe -m pytest backend/main_api/tests/test_template_14.py'
    - '.\.venv\Scripts\python.exe -m pytest backend/main_api/tests/test_template_renderer.py backend/main_api/tests/test_template_assets.py'
  coverage_map:
    criterion-reference-rights: ['case-rights-review', 'case-assets-contract']
    criterion-visual-system: ['case-visual-review', 'viewport-desktop', 'viewport-laptop', 'viewport-tablet', 'viewport-mobile']
    criterion-page-inventory: ['case-spec-inventory']
    criterion-deterministic-selection: ['case-contents-capacity', 'case-text-capacity', 'case-specialty-layout-kind']
    criterion-typography: ['case-font-fallback', 'case-long-body-split', 'case-visual-review']
    criterion-overflow: ['case-overflow-eight-items', 'case-long-body-split', 'case-long-body-with-images']
    criterion-image-protocol: ['case-image-counts', 'case-image-crop-ratios', 'case-missing-image-dimensions', 'case-image-count-mismatch', 'case-long-body-with-images']
    criterion-decoration-isolation: ['case-decoration-isolation', 'case-content-image-replace']
    criterion-assets: ['case-assets-contract', 'case-rights-review']
    criterion-registration: ['case-registration-and-resources', 'case-picker-unique']
    criterion-real-generation: ['case-real-worker-generation', 'case-specialty-layout-kind']
    criterion-responsive: ['viewport-desktop', 'viewport-laptop', 'viewport-tablet', 'viewport-mobile']
    criterion-interactions: ['case-async-error-feedback', 'viewport-desktop', 'viewport-laptop', 'viewport-tablet', 'viewport-mobile']
    criterion-editable: ['case-edit-save-reload', 'case-content-image-replace']
    criterion-export-roundtrip: ['export-roundtrip']

planning_run_permissions:
  allow_image_generation: false
  allow_code_changes: false
  allow_git_commit: false
  allow_git_push: false
  allow_merge_main: false
  allow_service_restart: false
  allow_production_deploy: false

required_build_authorizations:
  image_generation: true
  code_changes: true
  real_task_execution: true
  final_manual_close: true

open_decisions: []

known_limits:
  - '当前环境无法把该参考 PPTX 渲染为逐页 PNG；规划基于可验证的结构、内嵌封面缩略图、全部媒体原图、主题色和元素几何，不承诺逐像素复刻。'
  - '参考文件和 6 张照片的权利来源未提供；实施必须原创重绘固定视觉，并以用户内容图或许可清楚的素材替换照片。'
  - '当前渲染器只会从 metric/number/stat 自动推断 metrics；process、compare、hub-spoke、timeline、gallery 和 focus 需要内容 Agent 显式提供 data.layoutKind。'

      prompt_constraints:
        - '深蓝理性商务背景，青蓝半透明几何切面，原创构图'
        - '无文字、无 Logo、无水印、无真实人物、无第三方 UI'
        - '避免霓虹、科幻芯片、建筑照片和过度纹理'

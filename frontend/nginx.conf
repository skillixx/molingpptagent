# 入口与API按来源IP提供外层粗粒度保护；应用层仍按可信owner精确限流。
limit_req_zone $binary_remote_addr zone=trainppt_enter:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=trainppt_api:10m rate=120r/m;

# TLS终止层只允许传递规范协议和端口；其他值回退到当前受信代理连接属性。
map $http_x_forwarded_proto $trainppt_forwarded_proto {
    default $scheme;
    http http;
    https https;
}
map $http_x_forwarded_port $trainppt_forwarded_port {
    default $server_port;
    "80" 80;
    "443" 443;
}

# 5778只绑定宿主回环地址，并只信任固定Docker网关转交的客户端地址。
set_real_ip_from ${TRUSTED_PROXY_IP};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name ${SERVER_NAME};
    server_tokens off;
    client_max_body_size 110m;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 一次性ticket禁止进入访问日志；外层限流只使用来源IP，不读取或记录query。
    location = /enter {
        access_log off;
        limit_req zone=trainppt_enter burst=5 nodelay;
        proxy_pass http://${MAIN_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trainppt_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $trainppt_forwarded_port;
    }

    # 去掉/api前缀转发主API；SSE长响应禁用缓冲，但不启用WebSocket升级。
    location /api/ {
        limit_req zone=trainppt_api burst=60 nodelay;
        proxy_pass http://${MAIN_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 660s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trainppt_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $trainppt_forwarded_port;
    }

    # HTML永不长期缓存，避免发布后旧入口继续引用已清理的hash资源。
    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/trainppt-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # Vite正式构建的hash资源可不可变缓存；未命中时禁止回退HTML。
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/trainppt-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Vue Router history深链统一回退正式index.html。
    location / {
        root /usr/share/nginx/html;
        index index.html;
        include /etc/nginx/snippets/trainppt-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
